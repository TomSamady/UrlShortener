<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">

    <title>URL Shortener</title>

    <link rel = "stylesheet" href = "style.css">

</head>

<body>

    <div class = "container">

        <h1>URL Shortener</h1>

        <p>Enter A URL below to create a short link!</p>

        <form id = "shortenForm">
            <input 
                type="url" 
                id="urlInput" 
                placeholder="https://example.com"
                required
            >

            <button type="submit" id="shortenButton">
                Shorten URL
            </button>

        </form> //allows submission with the 'Enter' key

        <div id="result"></div>

    </div>

    <script src = "script.js"></script>

</body>


</html>
